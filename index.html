<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%;">
<head>
  <meta charset="utf-8" />
  <title>Upmanyu's Resume</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { width:100%; height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .full { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .message { text-align:center; max-width:720px; padding:24px; }
    .btn {
      display:inline-block;
      margin-top:12px;
      padding:10px 16px;
      border-radius:8px;
      border:1px solid #0b66ff;
      background:#0b66ff;
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
    .btn-secondary { background:transparent; color:#0b66ff; border-color:#0b66ff; }
    iframe { width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <div id="root" class="full">
    <!-- content will be injected by JS -->
  </div>

  <script>
(function () {
  const allowedUrl = 'https://hackergod00001.github.io/Resume/';
  const pdfViewerUrl = 'https://docs.google.com/gview?url=https://github.com/hackergod00001/Resume/raw/master/resume.pdf&embedded=true';

  function showPdf() {
    const iframe = document.createElement('iframe');
    iframe.src = pdfViewerUrl;
    iframe.title = "Upmanyu's Resume (PDF)";
    iframe.allow = "fullscreen";
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    document.getElementById('root').innerHTML = '';
    document.getElementById('root').appendChild(iframe);
  }

  function showBlockedMessage() {
    const root = document.getElementById('root');
    root.innerHTML = `
      <div class="message">
        <h2>Resume unavailable</h2>
        <p>This page will only open the PDF when accessed from <strong>${allowedUrl}</strong>.</p>
        <p>If you'd like to view it now, click below.</p>
        <a class="btn" href="${allowedUrl}" target="_blank" rel="noopener noreferrer">Open GitHub Page</a>
      </div>
    `;
  }

  try {
    const ref = document.referrer || '';
    const loc = window.location.href || '';
    const fromAllowedReferrer = ref.includes('hackergod00001.github.io/Resume');
    const isAllowedLocation = loc.includes('hackergod00001.github.io/Resume');

    if (fromAllowedReferrer || isAllowedLocation) {
      showPdf();
    } else {
      showBlockedMessage();
    }
  } catch (e) {
    console.error(e);
    showBlockedMessage();
  }
})();
</script>

</body>
</html>
