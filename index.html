<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%;">
<head>
  <meta charset="utf-8" />
  <title>Upmanyu's Resume</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { width:100%; height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .full { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .message { text-align:center; max-width:720px; padding:24px; }
    .btn {
      display:inline-block;
      margin-top:12px;
      padding:10px 16px;
      border-radius:8px;
      border:1px solid #0b66ff;
      background:#0b66ff;
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
    .btn-secondary { background:transparent; color:#0b66ff; border-color:#0b66ff; }
    iframe { width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <div id="root" class="full"></div>

  <script>
    (function () {
      // ✅ The GitHub Pages URL where this should work
      const allowedUrl = 'https://hackergod00001.github.io/Resume/';
      
      // ✅ Direct PDF file (using raw link, not blob)
      const pdfUrl = 'https://github.com/hackergod00001/Resume/raw/master/resume.pdf';

      // ---- Show the PDF directly in an iframe ----
      function showPdf() {
        const iframe = document.createElement('iframe');
        iframe.src = pdfUrl; // load directly
        iframe.title = "Upmanyu's Resume (PDF)";
        iframe.allow = "fullscreen";
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        const root = document.getElementById('root');
        root.innerHTML = '';
        root.appendChild(iframe);
      }

      // ---- Show a message if access is not allowed ----
      function showBlockedMessage() {
        const root = document.getElementById('root');
        root.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.className = 'message';
        wrapper.innerHTML = `
          <h2>Resume Unavailable</h2>
          <p>This resume can only be viewed from <strong>${allowedUrl}</strong>.</p>
          <p>If you reached this page directly, please open it from the GitHub link below.</p>
        `;
        const goButton = document.createElement('a');
        goButton.className = 'btn';
        goButton.href = allowedUrl;
        goButton.target = '_blank';
        goButton.rel = 'noopener noreferrer';
        goButton.textContent = 'Open GitHub Profile';
        wrapper.appendChild(goButton);

        root.appendChild(wrapper);
      }

      // ---- Allow only when on or referred from your GitHub Pages site ----
      try {
        const ref = document.referrer || '';
        const loc = window.location.href || '';
        const fromAllowedReferrer = ref.includes('hackergod00001.github.io/Resume');
        const isAllowedLocation = loc.includes('hackergod00001.github.io/Resume');

        if (fromAllowedReferrer || isAllowedLocation) {
          showPdf();
        } else {
          showBlockedMessage();
        }
      } catch (e) {
        console.error('Embed check failed:', e);
        showBlockedMessage();
      }
    })();
  </script>
</body>
</html>
